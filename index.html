<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101714"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Coach 365 — Performance & équilibre</title><style>

</style></head><body><header><div><div class="brand">COACH 365</div><small>Force · Endurance · Régularité</small></div><button class="secondary" id="settingsBtn" aria-label="Paramètres">Réglages</button></header><main id="app"></main><nav class="nav" aria-label="Navigation"><button data-tab="today"><b>01</b>Aujourd’hui</button><button data-tab="training"><b>02</b>Sport</button><button data-tab="food"><b>03</b>Repas</button><button data-tab="progress"><b>04</b>Suivi</button><button data-tab="more"><b>05</b>Plan</button></nav><div id="toast" class="toast hide" role="status"></div><script src="app.js"></script></body></html>
